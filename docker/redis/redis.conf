# Redis 配置文件
# KnowledgeFlow 项目

# 绑定所有网卡
bind 0.0.0.0

# 保护模式关闭（Docker环境）
protected-mode no

# 端口
port 6379

# 持久化配置
save 900 1
save 300 10
save 60 10000

# RDB文件名
dbfilename dump.rdb

# 工作目录
dir /data

# 日志级别
loglevel notice

# 最大内存（建议根据实际环境调整）
maxmemory 256mb

# 内存淘汰策略
maxmemory-policy allkeys-lru

# AOF持久化
appendonly yes
appendfilename "appendonly.aof"

# AOF同步策略
appendfsync everysec

# 键空间通知（用于过期事件）
notify-keyspace-events Ex
