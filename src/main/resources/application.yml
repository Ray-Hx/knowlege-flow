# ============================================
# KnowledgeFlow 应用配置
# ============================================

spring:
  config:
    # 本地密钥放在被 Git 忽略的 .env；部署环境仍应由平台注入环境变量。
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: KnowledgeFlow

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # 各环境统一的消费重试策略，避免生产 profile 遗漏后无重试。
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 5
        max-concurrency: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2
          max-interval: 5s

  data:
    # 项目通过 RedisTemplate 访问 Redis，没有 Redis Repository。
    redis:
      repositories:
        enabled: false
    # Neo4j Repository 由 TransactionConfig 显式扫描并绑定独立事务管理器。
    neo4j:
      repositories:
        enabled: false

  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Server配置
server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Logging配置
logging:
  level:
    root: INFO
    com.ray.knowledgeflow: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
  file:
    name: logs/knowledge-flow.log

# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# JWT 的生命周期是各环境共享配置；签名密钥由各 profile 单独提供。
jwt:
  expiration: 604800000 # 7天
  refresh-expiration: 2592000000 # 30天

---
# ============================================
# 开发环境配置
# ============================================
spring:
  config:
    activate:
      on-profile: dev

  # 数据源配置
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:knowledge_flow}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:kflow}
    password: ${MYSQL_PASSWORD:kflow_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: KnowledgeFlowHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 2s

    # Elasticsearch配置
    elasticsearch:
      repositories:
        enabled: true

  # Neo4j配置
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_BOLT_PORT:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:neo4j_password}

  # RabbitMQ配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin_password}
    virtual-host: ${RABBITMQ_VHOST:knowledge_flow}
  # Security OAuth2 (GitHub)
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            scope: read:user,user:email
        provider:
          github:
            user-name-attribute: login

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

# Elasticsearch配置
elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  scheme: http

# Qdrant配置
qdrant:
  host: localhost
  port: 6334  # gRPC 端口 (注意：6333 是 REST API 端口，gRPC 需要 6334)
  api-key: ${QDRANT_API_KEY:}
  use-tls: false
  operation-timeout-ms: ${QDRANT_OPERATION_TIMEOUT_MS:5000}

# MinIO配置
minio:
  endpoint: http://${MINIO_HOST:localhost}:${MINIO_API_PORT:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket-name: knowledge-flow

# Redisson配置
redisson:
  single-server-config:
    address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
    database: 0
    connection-pool-size: 64
    connection-minimum-idle-size: 10
    idle-connection-timeout: 10000
    timeout: 3000

# LangChain4j配置
langchain4j:
  open-ai:
    base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
    api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:}}
    model-name: ${OPENAI_MODEL_NAME:deepseek-chat}
    temperature: 0.7
    timeout: 30s

# JWT配置
jwt:
  # 本地未设置时由 JwtUtils 生成本进程随机密钥，不使用公开固定默认值。
  secret: ${JWT_SECRET:}

# 应用自定义配置
app:
  # RAG 配置
  rag:
    chunk:
      # 语义切片：取相邻句子向量距离的第 N 百分位作为断点阈值，越大切得越少
      breakpoint-percentile: 85
      # 切片字符数下限，低于此值与相邻切片合并
      min-chars: 80
      # 切片字符数上限，超出强制拆分
      max-chars: 1000
      # 求向量时向前后各拼接的句子数，用于抑制单句噪声
      buffer-size: 1
    retrieve:
      # 召回候选数，需明显大于 top-k 才有精排空间
      candidate-size: 20
      # 精排后送入生成模型的片段数
      top-k: 5
      # 向量相似度下限
      score-threshold: 0.5
      # Qdrant 召回超时后降级为无上下文回答，不无限占用请求线程
      timeout-ms: ${RAG_RETRIEVE_TIMEOUT_MS:5000}
    rerank:
      # 重排实现: cross-encoder(专用重排模型) | llm(大模型列表式) | none(对照组)
      provider: ${RERANK_PROVIDER:cross-encoder}
      # 重排服务地址。自部署 TEI 为 http://localhost:8080/rerank，
      # 托管服务填厂商的 /v1/rerank
      base-url: ${RERANK_BASE_URL:http://localhost:8081/rerank}
      # 交叉编码器模型。中文场景 bge-reranker-v2-m3 是开源里的最优解
      model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
      # 托管服务需要，自部署留空
      api-key: ${RERANK_API_KEY:}
      # 本机 MPS 上长文本重排的尾延迟可超过 2 秒；先留出余量，再根据 p95 下调
      timeout-ms: ${RERANK_TIMEOUT_MS:3500}
      # 以下仅 provider=llm 时生效
      enabled: true
      snippet-chars: 200
  search:
    hybrid:
      # BM25 和向量结果经 RRF 融合后，送入 reranker 的最小候选窗口
      rerank-candidate-size: ${HYBRID_RERANK_CANDIDATE_SIZE:20}
      # 任一检索分支超过此时间即降级为空结果，另一分支仍可继续完成搜索
      timeout-ms: ${HYBRID_SEARCH_TIMEOUT_MS:5000}
  # 同步任务配置
  sync:
    github:
      enabled: true
      cron: '0 0 2 * * ?' # 每天凌晨2点
    arxiv:
      enabled: true
      cron: '0 30 2 * * ?' # 每天凌晨2:30
    rss:
      enabled: true
      cron: '0 0 */6 * * ?' # 每6小时

  # 文件存储配置
  storage:
    type: minio # local, minio
    local-path: ./upload
    max-size: 100MB

  # AI配置
  ai:
    provider: openai # openai, azure, ollama
    embedding-model: all-minilm-l6-v2
    rag:
      chunk-size: 512
      chunk-overlap: 50
      top-k: 5
    # 多轮对话记忆：历史消息回灌给模型，否则追问里的指代无从解析
    memory:
      # 回灌的历史消息条数上限（约 5 轮问答），过大会推高 token 成本并稀释当前问题
      window-size: 10
      # 单条历史保留的字符数，AI 回答动辄上千字，整窗原样回灌会挤占上下文
      max-message-chars: 1000
    # 检索查询改写：追问不自包含时直接 embedding 会召回跑偏，先消解指代
    query-rewrite:
      # 关掉则直接用原始问题检索，便于对照改写带来的召回差异
      enabled: true
      # 参与改写的历史条数，指代通常只依赖最近一两轮
      history-size: 4
      # 改写提示中每条历史保留的字符数，消解指代只需话题线索
      history-chars: 200
      # 改写结果字符数上限，超出说明模型没按要求只输出问题，判为不可用
      max-result-chars: 200

---
# ============================================
# 测试环境配置
# ============================================
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:mysql://test-mysql-host:3306/knowledge_flow?useUnicode=true&characterEncoding=utf8&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.ray.knowledgeflow: INFO

---
# ============================================
# 生产环境配置
# ============================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl: true

  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

elasticsearch:
  host: ${ES_HOST}
  port: ${ES_PORT:9200}
  scheme: https
  username: ${ES_USERNAME}
  password: ${ES_PASSWORD}

qdrant:
  host: ${QDRANT_HOST}
  port: ${QDRANT_PORT:6334}
  api-key: ${QDRANT_API_KEY}
  use-tls: true

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

langchain4j:
  open-ai:
    api-key: ${OPENAI_API_KEY}
    model-name: ${OPENAI_MODEL:gpt-4}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    com.ray.knowledgeflow: INFO
  file:
    name: /var/log/knowledge-flow/application.log

# ==================== Resilience4j 限流配置 ====================
resilience4j:
  ratelimiter:
    instances:
      ai-service:
        # 每秒最多 5 个请求（根据 DeepSeek API 限制配置）
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 10s
        # 是否允许等待健康记录的发布者
        register-health-indicator: true
