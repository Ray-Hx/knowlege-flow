# KnowledgeFlow Docker Compose 配置文件
#
# ── 按需启动 ────────────────────────────────────────────────
# 全套中间件约占 4.5GB 内存，日常开发没必要全开。
#
#   docker compose up -d                    核心: MySQL + Redis + RabbitMQ (~650MB)
#   docker compose --profile rag up -d      + Qdrant，调 RAG / 重排
#   docker compose --profile search up -d   + Elasticsearch，调搜索
#   docker compose --profile graph up -d    + Neo4j，调知识图谱
#   docker compose --profile storage up -d  + MinIO，调文件上传
#   docker compose --profile full up -d     全套，演示或联调用
#
# profile 可叠加: docker compose --profile rag --profile search up -d
# 停单个服务:     docker compose stop neo4j
#
# 为什么 RabbitMQ 属于核心而非可选：
#   内容抓取、AI 增强和向量索引都通过 MQ 处理。短暂投递失败
#   不会回滚已保存的笔记，但对应的异步能力会延迟，需从 DLQ/重建任务补偿。
#
# reranker 容器单独用 --profile rerank 启动，且不含在 full 里：
#   macOS 上 Docker 无法直通 GPU，本机开发请用 reranker-service/ 下的原生服务；
#   该容器是给有 NVIDIA 卡的部署环境准备的。
# ────────────────────────────────────────────────────────────

# 自定义网络
networks:
  knowledge-flow-network:
    driver: bridge
    name: knowledge-flow-network

# 数据卷
volumes:
  mysql-data:
  redis-data:
  elasticsearch-data:
  neo4j-data:
  qdrant-data:
  # 卷名带 -new 是历史原因：旧卷 minio-data 里残留着已废弃的凭据，
  # 换新卷名以确保 MINIO_ROOT_USER/PASSWORD 能重新初始化生效
  minio-data-new:
  rabbitmq-data:
  reranker-data:


services:
  # MySQL 8.0 - 主数据库
  mysql:
    image: mysql:8.0
    container_name: knowledge-flow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-knowledge_flow}
      MYSQL_USER: ${MYSQL_USER:-kflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kflow_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - knowledge-flow-network

  # Redis 7.0 - 缓存和会话管理
  redis:
    image: redis:7.0-alpine
    container_name: knowledge-flow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge-flow-network

  # Elasticsearch 8.x - 全文检索
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: knowledge-flow-elasticsearch
    restart: unless-stopped
    profiles: [ "search", "full" ]
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - cluster.name=knowledge-flow-cluster
      - node.name=knowledge-flow-node
    ports:
      - "${ES_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./docker/elasticsearch/plugins:/usr/share/elasticsearch/plugins
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - knowledge-flow-network

  # Neo4j 5.x - 知识图谱数据库
  neo4j:
    image: neo4j:5.15.0
    container_name: knowledge-flow-neo4j
    restart: unless-stopped
    profiles: [ "graph", "full" ]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - ./docker/neo4j/plugins:/plugins
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider http://localhost:7474 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - knowledge-flow-network

  # Qdrant - 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowledge-flow-qdrant
    restart: unless-stopped
    profiles: [ "rag", "full" ]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 6333 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge-flow-network

  # MinIO - 对象存储
  minio:
    image: minio/minio:latest
    container_name: knowledge-flow-minio
    restart: unless-stopped
    profiles: [ "storage", "full" ]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data-new:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - knowledge-flow-network

  # MinIO 初始化脚本 (全自动建桶 + 设权限)
  minio-init:
    image: minio/mc:latest
    container_name: knowledge-flow-minio-init
    profiles: [ "storage", "full" ]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/knowledge-flow --ignore-existing;
      /usr/bin/mc anonymous set public myminio/knowledge-flow;
      echo 'Bucket created and public policy set!';
      exit 0;
      "
    networks:
      - knowledge-flow-network



  # RabbitMQ 3.x - 消息队列
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: knowledge-flow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-knowledge_flow}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - knowledge-flow-network

  # 交叉编码器重排服务 (HuggingFace Text Embeddings Inference)
  # RAG 精排阶段使用。默认 profile 不启动，需要时: docker compose --profile rerank up -d
  # 无 GPU 时可改用 CPU 镜像 ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: knowledge-flow-reranker
    restart: unless-stopped
    profiles: [ "rerank" ]
    command: [ "--model-id", "BAAI/bge-reranker-v2-m3" ]
    ports:
      - "${RERANK_PORT:-8081}:80"
    volumes:
      - reranker-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - knowledge-flow-network
